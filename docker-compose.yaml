services:
  har-torch:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: kubota-torch
    privileged: true
    tty: true
    mem_limit: 256g    
    memswap_limit: 256g
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 2
            capabilities: [gpu]
    shm_size: 8gb
    volumes:
      - /home/kubota:/mnt/home
